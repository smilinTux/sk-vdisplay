# Name shown in Moonlight is "<HOST_LABEL>-<screen>"
HOST_LABEL=mylaptop
# The physical panel every virtual screen is placed around (see `xrandr`)
ANCHOR=eDP-1
# Screens whose Moonlight session gets the host's sound: "all" (default), "none",
# or names, e.g. "tv". While a screen that streams sound is connected, Sunshine
# moves all sound to that device and mutes the host speakers, so leave
# extra-monitor screens out of this list to keep sound on the host.
AUDIO_SCREENS=all
